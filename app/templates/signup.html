{% extends "base_auth.html" %}
{% block title %}Sign up · Storyline{% endblock %}
{% block content %}
<div class="page-head-main">
  <span class="eyebrow">Get started</span>
  <h1 class="page-title">Create your account</h1>
</div>

{% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}

<form method="post" action="/signup">
  <div class="form-field">
    <label for="email">Email</label>
    <input type="email" name="email" id="email" class="form-input" autocomplete="email" required autofocus>
  </div>
  <div class="form-field">
    <label for="password">Password</label>
    <input type="password" name="password" id="password" class="form-input" autocomplete="new-password" required minlength="8">
    <span class="hint">At least 8 characters.</span>
  </div>
  <div class="form-field">
    <label for="confirm_password">Confirm password</label>
    <input type="password" name="confirm_password" id="confirm_password" class="form-input" autocomplete="new-password" required minlength="8">
  </div>
  <button class="btn btn-primary" type="submit">Sign up</button>
</form>

<div class="auth-links"><span>Already have an account? <a href="/login">Log in</a></span></div>
{% endblock %}
