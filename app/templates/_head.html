{# Applied before first paint so a saved theme never flashes the wrong palette. 'system' = no attribute, the media query decides. #}
<script>
  (function () {
    try {
      var t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      if (localStorage.getItem("palette") === "paperclip") document.documentElement.setAttribute("data-palette", "paperclip");
    } catch (e) {}
  })();
</script>
