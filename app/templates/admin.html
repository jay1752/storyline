{% extends "base.html" %}
{% block title %}Platform admin · Tenetfolio{% endblock %}
{% block content %}
<div class="page-head">
  <div class="page-head-main">
    <span class="eyebrow">System · platform admin</span>
    <h1 class="page-title">Platform admin</h1>
    <p class="page-sub">Visible to platform admins only. Each tab loads when you open it.</p>
  </div>
</div>

<nav class="admin-tabs" role="tablist" aria-label="Platform admin">
  {% for key, label in tabs %}<button type="button" role="tab" class="admin-tab {{ 'on' if key == tab else '' }}" data-tab="{{ key }}" aria-selected="{{ 'true' if key == tab else 'false' }}">{{ label }}</button>{% endfor %}
</nav>

<div id="admin-tab" role="tabpanel" hx-get="/admin/tab/{{ tab }}" hx-trigger="load" hx-swap="innerHTML"><p class="section-note">Loading…</p></div>

<script>
(function () {
  var tabs = document.querySelectorAll(".admin-tab");
  tabs.forEach(function (b) {
    b.addEventListener("click", function () {
      tabs.forEach(function (x) { var on = x === b; x.classList.toggle("on", on); x.setAttribute("aria-selected", on ? "true" : "false"); });
      document.getElementById("admin-tab").innerHTML = '<p class="section-note">Loading…</p>';
      htmx.ajax("GET", "/admin/tab/" + b.dataset.tab, { target: "#admin-tab", swap: "innerHTML" });
      history.replaceState(null, "", "/admin?tab=" + b.dataset.tab);
    });
  });
})();
</script>
{% endblock %}
