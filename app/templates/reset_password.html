{% extends "base_auth.html" %}
{% block title %}Reset password · Stocktale{% endblock %}
{% block content %}
<div class="page-head-main">
  <span class="eyebrow">Account recovery</span>
  <h1 class="page-title">Set a new password</h1>
</div>

{% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}

<form method="post" action="/reset-password">
  <input type="hidden" name="token" value="{{ token }}">
  <div class="form-field">
    <label for="password">New password</label>
    <input type="password" name="password" id="password" class="form-input" autocomplete="new-password" required minlength="8" autofocus>
    <span class="hint">At least 8 characters.</span>
  </div>
  <div class="form-field">
    <label for="confirm_password">Confirm new password</label>
    <input type="password" name="confirm_password" id="confirm_password" class="form-input" autocomplete="new-password" required minlength="8">
  </div>
  <button class="btn btn-primary" type="submit">Set new password</button>
</form>
{% endblock %}
